<!DOCTYPE html>
<html>
<head>
    <title>Page Not Found</title>
    <style>
        /* General Reset */
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f3f4f6;
            color: #333;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background: #ffffff;
        }

        h1 {
            font-size: 48px;
            color: #ff4f4f;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
        }

        a {
            text-decoration: none;
            color: #0078d7;
            font-weight: bold;
            background-color: #f0f4ff;
            padding: 10px 20px;
            border-radius: 5px;
        }

        a:hover {
            background-color: #e2edff;
        }

        .icon {
            font-size: 64px;
            color: #ff4f4f;
            margin-bottom: 20px;
        }
    </style>
    <script>
        // Define redirects for specific paths
        const redirects = {
            "/linkedin": "https://www.linkedin.com/in/your-linkedin-username",
            "/github": "https://github.com/your-username",
            "/twitter": "https://twitter.com/your-twitter-handle"
        };

        // Get the current path
        const path = window.location.pathname;

        // Check if the path exists in the redirects object
        if (redirects[path]) {
            window.location.href = redirects[path];
        } else {
            // If no match, show custom message
            document.addEventListener("DOMContentLoaded", () => {
                document.body.innerHTML = `
                    <div class="container">
                        <div class="icon">❌</div>
                        <h1>Oops! Page Not Found</h1>
                        <p>We couldn't find the page you're looking for. It might have been moved or doesn't exist.</p>
                        <p><a href="/">Go Back to Homepage</a></p>
                    </div>
                `;
            });
        }
    </script>
</head>
<body>
</body>
</html>
